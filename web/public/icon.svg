<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4280"/>
      <stop offset="0.5" stop-color="#0f2145"/>
      <stop offset="1" stop-color="#060c19"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#3ff0a8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3ff0a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5aa9ff"/>
      <stop offset="1" stop-color="#3ff0a8"/>
    </linearGradient>
    <linearGradient id="candle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#cfe0ff" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Grille du graphique -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="4">
    <line x1="64" y1="164" x2="448" y2="164"/>
    <line x1="64" y1="260" x2="448" y2="260"/>
    <line x1="64" y1="356" x2="448" y2="356"/>
  </g>
  <!-- Bougies -->
  <g fill="url(#candle)">
    <rect x="137" y="262" width="14" height="168" rx="7" opacity="0.55"/>
    <rect x="112" y="296" width="64" height="104" rx="16"/>
    <rect x="249" y="188" width="14" height="196" rx="7" opacity="0.55"/>
    <rect x="224" y="222" width="64" height="132" rx="16"/>
    <rect x="361" y="98" width="14" height="196" rx="7" opacity="0.55"/>
    <rect x="336" y="130" width="64" height="132" rx="16"/>
  </g>
  <!-- Tendance haussière tracée par le bot -->
  <path d="M84 416 L198 320 L282 362 L414 196" fill="none" stroke="#3ff0a8" stroke-opacity="0.6" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
  <path d="M84 416 L198 320 L282 362 L414 196" fill="none" stroke="url(#line)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M344 190 L420 182 L414 258" fill="none" stroke="#3ff0a8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#3ff0a8" stroke-width="8">
    <circle cx="198" cy="320" r="17"/>
    <circle cx="282" cy="362" r="17"/>
  </g>
</svg>
